image: node:22

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - worker/node_modules/

stages:
  - build
  - deploy

# ── Stage 1: Build ─────────────────────────────────────────
build:
  stage: build
  script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm install
    - pnpm build
  artifacts:
    paths:
      - dist
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    PUBLIC_FIREBASE_API_KEY: $PUBLIC_FIREBASE_API_KEY
    PUBLIC_FIREBASE_AUTH_DOMAIN: $PUBLIC_FIREBASE_AUTH_DOMAIN
    PUBLIC_FIREBASE_PROJECT_ID: $PUBLIC_FIREBASE_PROJECT_ID
    PUBLIC_FIREBASE_STORAGE_BUCKET: $PUBLIC_FIREBASE_STORAGE_BUCKET
    PUBLIC_FIREBASE_MESSAGING_SENDER_ID: $PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    PUBLIC_FIREBASE_APP_ID: $PUBLIC_FIREBASE_APP_ID
    PUBLIC_FIREBASE_MEASUREMENT_ID: $PUBLIC_FIREBASE_MEASUREMENT_ID
    PUBLIC_WORKER_API_URL: $PUBLIC_WORKER_API_URL

# ── Stage 2a: GitLab Pages (staging preview) ──────────────
pages:
  stage: deploy
  needs:
    - build
  script:
    - echo "Publishing to GitLab Pages..."
  artifacts:
    paths:
      - dist
  publish: dist
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always

# ── Stage 2b: Firebase Hosting (production) ───────────────
firebase-deploy:
  stage: deploy
  needs:
    - build
  before_script:
    - npm install -g firebase-tools
  script:
    - firebase deploy --only hosting --project ting-51902 --token "$FIREBASE_TOKEN"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ── Stage 2c: Cloudflare Worker deploy ────────────────────
worker-deploy:
  stage: deploy
  needs:
    - build
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
  script:
    - cd worker
    - npm ci
    - npx wrangler deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CLOUDFLARE_API_TOKEN != null
  environment:
    name: production
